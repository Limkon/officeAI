  <!-- Load Office.js only when hosted inside Microsoft Office -->
  <script>

        var s = document.createElement('script');
        s.src = 'https://appsforoffice.microsoft.com/lib/1/hosted/office.js';
        s.async = false;
        document.head.appendChild(s);
      }
    })();
  </script>
