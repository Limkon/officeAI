appId: com.officeai.desktop
productName: OfficeAI
copyright: Copyright © 2026 OfficeAI
electronVersion: "33.2.1"
npmRebuild: false
directories:
  output: ../../release
  buildResources: assets
files:
  - dist/main.cjs
  - assets/**/*
  - package.json
extraResources:
  - from: ../addin-ui/dist
    to: assets/addin-ui
  - from: ../office-addin
    to: assets/office-addin
  - from: ../wps-addin
    to: assets/wps-addin
  # Office 唤醒器随安装包一起分发：安装后由控制中心一键注册。
  - from: ../../windows/waker/install-waker.ps1
    to: assets/waker/install-waker.ps1
  - from: ../../windows/waker/build/OfficeAI.Waker.dll
    to: assets/waker/OfficeAI.Waker.dll
protocols:
  - name: OfficeAI 一键启动
    schemes:
      - officeai
win:
  icon: assets/icon-256.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: OfficeAI-Setup-${version}-win-x64.${ext}
  # 安装完成后自动集成 Office / WPS（证书、加载项、唤醒器），见 build/installer.nsh
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  shortcutName: OfficeAI
