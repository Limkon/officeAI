name: Build Windows Installer

on:
  push:
    branches:
      - master
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npm run build

      - name: Run unit & gateway integration tests
        run: npm test

      - name: Build Office waker (COM add-in)
        shell: pwsh
        run: ./windows/waker/install-waker.ps1 -Action Install -Build

      # 安装包会把 build/OfficeAI.Waker.dll 打进 resources/assets/waker，
      # 缺失会导致 electron-builder 打包失败，所以这里先硬性校验。
      - name: Verify waker DLL built
        shell: pwsh
        run: |
          $dll = './windows/waker/build/OfficeAI.Waker.dll'
          if (-not (Test-Path $dll)) { throw 'OfficeAI.Waker.dll 未生成' }
          Get-Item $dll | Select-Object Name, Length

      - name: Unregister waker (CI is a throwaway runner)
        shell: pwsh
        continue-on-error: true
        run: ./windows/waker/install-waker.ps1 -Action Uninstall

      - name: Build Windows installer (NSIS)
        run: npm run dist:win --workspace=@officeai/desktop-app

      # 安装包里必须真的带上唤醒器，否则控制中心的「一键安装」会失败。
      - name: Verify installer contents
        shell: pwsh
        run: |
          $installer = Get-ChildItem ./release/OfficeAI-Setup-*.exe -ErrorAction SilentlyContinue
          if (-not $installer) { throw '未找到 release/OfficeAI-Setup-*.exe' }
          Get-Item $installer.FullName | Select-Object Name, Length
          foreach ($f in @(
            './release/win-unpacked/resources/assets/waker/OfficeAI.Waker.dll',
            './release/win-unpacked/resources/assets/waker/install-waker.ps1'
          )) {
            if (-not (Test-Path $f)) { throw "安装包资源缺失：$f" }
            Get-Item $f | Select-Object Name, Length
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OfficeAI-Windows-Setup
          path: release/OfficeAI-Setup-*.exe
          if-no-files-found: error
